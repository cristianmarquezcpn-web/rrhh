<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Esencial Salud</title>
    <style>
        :root { --cobalto: #1a2a6c; --oro: #f1c40f; --gris: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { color: var(--cobalto); margin-bottom: 30px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .menu-container { display: grid; grid-template-columns: 1fr; gap: 20px; width: 90%; max-width: 400px; }
        .card { background: white; padding: 30px; border-radius: 15px; text-decoration: none; text-align: center; border: 2px solid transparent; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; }
        .card:hover { border-color: var(--oro); transform: translateY(-5px); }
        .card i { font-size: 40px; display: block; margin-bottom: 10px; }
        .card h2 { margin: 0; color: var(--cobalto); }
        .card p { margin: 5px 0 0; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <h1>ESENCIAL SALUD</h1>
    <div class="menu-container">
        <a href="reloj.html" class="card">
            <i>⏰</i>
            <h2>Reloj de Firmas</h2>
            <p>Acceso para profesionales</p>
        </a>
        
        <a href="asistencia1.html" class="card">
            <i>📅</i>
            <h2>Planilla Administrativa</h2>
            <p>Control de asistencia y liquidación</p>
        </a>
    </div>
</body>
</html>
